<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예매내역 - CGV</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo"><img src="https://cdn.cgv.co.kr/cgvpomscontent/ips/unitCnts/2025/1114/4c8da3708290405bb6400a6a553cade2.svg" alt="CGV" height="28"></a>
            <nav class="nav">
                <a href="/pages/movies.html">영화</a>
                <a href="/pages/schedule.html">상영시간표</a>
                <a href="/pages/bookings.html">예매내역</a>
            </nav>
            <div class="auth-buttons" id="auth-buttons">
                <a href="/pages/login.html" class="btn btn-outline">로그인</a>
                <a href="/pages/register.html" class="btn btn-primary">회원가입</a>
            </div>
            <div class="user-menu" id="user-menu" style="display:none;">
                <span id="user-name" style="color:#ccc;font-size:14px;"></span>
                <button class="btn btn-outline" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </header>

    <div class="bookings-section">
        <h2>예매내역</h2>
        <div id="bookings-list">
            <!-- 예매 내역 동적 생성 -->
        </div>
    </div>

    <footer class="footer">
        <p>CJ CGV(주) | CJ AI 클라우드 엔지니어 부트캠프 실습 프로젝트</p>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            if (!requireAuth()) return;
            loadBookings();
        });

        async function loadBookings() {
            try {
                const bookings = await api.get(`${API_BASE}/bookings`);
                renderBookings(bookings);
            } catch (err) {
                console.error('예매내역 로드 실패:', err);
                document.getElementById('bookings-list').innerHTML = '<p style="color:#888;text-align:center;padding:40px 0;">예매내역을 불러올 수 없습니다.</p>';
            }
        }

        function renderBookings(bookings) {
            const container = document.getElementById('bookings-list');
            if (!bookings || bookings.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:60px 0;">
                        <p style="color:#888;font-size:16px;margin-bottom:16px;">예매 내역이 없습니다.</p>
                        <a href="/pages/movies.html" class="btn btn-primary">영화 보러가기</a>
                    </div>
                `;
                return;
            }
            container.innerHTML = bookings.map(b => `
                <div class="booking-card">
                    <div class="booking-header">
                        <span>예매번호: ${b.id || '-'}</span>
                        <span class="booking-status">${b.status || '예매완료'}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <h3 style="font-size:16px;margin-bottom:6px;">${b.movie_title || '영화'}</h3>
                            <p style="font-size:13px;color:#999;">
                                ${b.date || ''} ${b.start_time || ''}<br>
                                ${b.theater || b.hall || ''} · 좌석: ${Array.isArray(b.seats) ? b.seats.join(', ') : (b.seats || '-')}
                            </p>
                        </div>
                        <div style="text-align:right;">
                            <p style="font-size:18px;font-weight:700;color:#fb4357;">${b.total_price ? formatPrice(b.total_price) : ''}</p>
                            <p style="font-size:12px;color:#666;margin-top:4px;">${b.created_at ? b.created_at.split('T')[0] : ''}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
